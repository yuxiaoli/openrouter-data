name: Validate preserved Python chart CLI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.py'
      - 'scripts/legacy_chart_gallery/**'
      - 'scripts/commands.sh'
      - 'tests/test_*.py'
      - 'tests/test_legacy_chart_ui.cjs'
      - 'docs/chart-cli*'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/chart-cli.yml'

permissions:
  contents: read

jobs:
  chart-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install fixed Python dependencies and original chart font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          uv sync --frozen
      - name: Validate CLI, original preservation and legacy assets
        run: |
          uv run python -m unittest discover -s tests -v
          uv run python scripts/check_contracts.py
          node --check scripts/legacy_chart_gallery/web/app.js
          node --test tests/test_legacy_chart_ui.cjs
          bash --noprofile --norc -n scripts/commands.sh
      - name: Read an existing public snapshot, never recollect
        run: |
          uv run python scripts/fetch_snapshot.py probe
          uv run python scripts/fetch_snapshot.py fetch
      - name: Generate all fourteen PNGs with source provenance
        run: uv run python scripts/generate_charts.py --output .cache/chart-exports/ci
